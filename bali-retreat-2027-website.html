<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bali Retreat 2027 with Lee Ann Somers — August 25–September 5, 2027. Coming soon.">
  <title>Bali Retreat 2027 | Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #07191c;
      --cream: #fffaf0;
      --gold: #e8bd72;
      --aqua: #a8ddd5;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--cream);
      background:
        radial-gradient(circle at 15% 12%, rgba(64, 143, 136, .26), transparent 34rem),
        radial-gradient(circle at 88% 82%, rgba(232, 189, 114, .13), transparent 30rem),
        var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(1120px, 100%);
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(320px, .92fr) minmax(360px, 1.08fr);
      align-items: center;
      gap: clamp(32px, 7vw, 92px);
      padding: clamp(28px, 5vw, 70px);
    }

    .portrait-wrap {
      position: relative;
      max-width: 470px;
      margin-inline: auto;
    }

    .portrait-wrap::before {
      content: "";
      position: absolute;
      inset: -13px 13px 13px -13px;
      border: 1px solid rgba(232, 189, 114, .72);
      z-index: 0;
    }

    .portrait {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: min(72svh, 700px);
      min-height: 470px;
      object-fit: cover;
      object-position: center 38%;
      box-shadow: 0 28px 70px rgba(0, 0, 0, .42);
    }

    .content { max-width: 570px; }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--aqua);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .27em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(54px, 8vw, 106px);
      font-weight: 400;
      line-height: .88;
      letter-spacing: -.045em;
    }

    h1 span {
      display: block;
      margin-top: 14px;
      color: var(--gold);
      font-style: italic;
      font-size: .61em;
      letter-spacing: -.025em;
    }

    .rule {
      width: 72px;
      height: 1px;
      margin: 35px 0 27px;
      background: var(--gold);
    }

    .host {
      margin: 0 0 10px;
      color: rgba(255, 250, 240, .78);
      font-size: clamp(15px, 1.7vw, 18px);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .dates {
      margin: 0 0 36px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 3.2vw, 38px);
      line-height: 1.25;
    }

    .soon {
      display: inline-block;
      margin: 0;
      padding: 13px 20px 12px;
      border: 1px solid rgba(168, 221, 213, .7);
      color: var(--aqua);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .29em;
      text-transform: uppercase;
    }

    .brand {
      margin: 34px 0 0;
      color: rgba(255, 250, 240, .48);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    @media (max-width: 760px) {
      .page {
        grid-template-columns: 1fr;
        gap: 46px;
        padding: 34px 24px 50px;
      }

      .portrait-wrap { width: min(88%, 400px); }

      .portrait {
        height: min(58svh, 590px);
        min-height: 420px;
      }

      .content { text-align: center; margin-inline: auto; }
      .rule { margin-inline: auto; }
      h1 { font-size: clamp(56px, 18vw, 88px); }
    }
  </style>
</head>

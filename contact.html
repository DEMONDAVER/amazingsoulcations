<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Amazing Soulcations</title>
  <meta name="description" content="Contact Amazing Soulcations about upcoming journeys, custom group adventures, hosting, and general questions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Prata&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #102f36;
      --navy-deep: #08232a;
      --gold: #c99a47;
      --cream: #f7f0e4;
      --white: #fff;
      --ink: #19343a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(201,154,71,.18), transparent 35%),
        var(--cream);
      font-family: "Jost", sans-serif;
      min-height: 100vh;
    }
    header {
      background: var(--navy-deep);
      padding: 18px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      color: var(--white);
      text-decoration: none;
      font-family: "Prata", serif;
      font-size: clamp(20px, 3vw, 28px);
    }
    .back {
      color: var(--cream);
      text-decoration: none;
      font-size: 15px;
    }
    main {
      width: min(720px, 90%);
      margin: 48px auto;
    }
    .eyebrow {
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 8px 0 12px;
      color: var(--navy);
      font-family: "Prata", serif;
      font-size: clamp(34px, 6vw, 54px);
      font-weight: 400;
    }
    .intro {
      margin: 0 0 28px;
      font-size: 18px;
      line-height: 1.6;
    }
    form {
      padding: clamp(24px, 5vw, 42px);
      background: var(--white);
      border-top: 4px solid var(--gold);
      box-shadow: 0 18px 60px rgba(8,35,42,.12);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .full { grid-column: 1 / -1; }
    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid #c8d0d1;
      border-radius: 0;
      background: #fff;
      padding: 13px 14px;
      color: var(--ink);
      font: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(201,154,71,.4);
      border-color: var(--gold);
    }
    textarea {
      min-height: 160px;
      resize: vertical;
    }
    button {
      width: 100%;
      border: 0;
      background: var(--navy);
      color: var(--white);
      padding: 15px 20px;
      font: 600 15px "Jost", sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { background: var(--gold); }
    .note {
      margin: 16px 0 0;
      color: #607176;
      font-size: 13px;
      text-align: center;
    }
    @media (max-width: 620px) {
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      main { margin-top: 32px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">Amazing Soulcations</a>
    <a class="back" href="index.html">&larr; Back to website</a>
  </header>

  <main>
    <div class="eyebrow">We’d love to hear from you</div>
    <h1 id="page-title">Contact Us</h1>
    <p class="intro" id="page-intro">Tell us what you’re interested in, and we’ll get back to you.</p>

    <form action="https://formspree.io/f/xqernnnl" method="POST">
      <input type="hidden" name="_subject" id="form-subject" value="New Amazing Soulcations Website Inquiry">
      <input type="hidden" name="source_page" value="Amazing Soulcations contact form">

      <div class="grid">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div>
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel">
        </div>
        <div>
          <label for="interest">What are you interested in?</label>
          <select id="interest" name="interest" required>
            <option value="">Choose one</option>
            <option value="Upcoming journey">An upcoming journey</option>
            <option value="Custom group adventure">A custom group adventure</option>
            <option value="Become a host">Becoming a host</option>
            <option value="General question">A general question</option>
          </select>
        </div>
        <div class="full">
          <label for="message">How can we help?</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <div class="full">
          <button type="submit">Send Message</button>
          <p class="note">Your message will be sent securely to Amazing Soulcations.</p>
        </div>
      </div>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const topic = params.get("topic");
    const interest = document.getElementById("interest");
    const title = document.getElementById("page-title");
    const intro = document.getElementById("page-intro");
    const subject = document.getElementById("form-subject");

    if (topic === "group") {
      title.textContent = "Plan Your Group Adventure";
      intro.textContent = "Tell us about your group and the kind of experience you have in mind.";
      interest.value = "Custom group adventure";
      subject.value = "New Custom Group Adventure Inquiry";
    } else if (topic === "host") {
      title.textContent = "Become a Host";
      intro.textContent = "Tell us a little about yourself and the journey you’d like to create.";
      interest.value = "Become a host";
      subject.value = "New Amazing Soulcations Host Inquiry";
    }
  </script>
</body>
</html>
